name: Build ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install archiso
        run: |
          pacman -Syu --noconfirm --needed archiso git

      - uses: actions/checkout@v4

      - name: Build ISO
        run: |
          mkarchiso -v -w /tmp/archiso-work -o out .
          ls -lh out

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-by-tin-iso
          path: out/*.iso
          retention-days: 14

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.iso
